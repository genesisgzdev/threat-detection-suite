name: TDS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tds-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
      - name: Contract and repository checks
        run: bash build.sh
      - name: Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate SOC bot dependencies
        run: python -m pip install --requirement tools/soc/requirements.txt
      - name: Check patch formatting
        run: git diff --check

  windows-user-mode:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure user-mode build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DTDS_ENABLE_YARA=OFF
      - name: Build user-mode components
        run: cmake --build build --config Release --parallel
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

  windows-driver-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate checked-in WDK project and shared ABI
        shell: pwsh
        run: |
          python tests/contract_checks.py
          pwsh -NoProfile -File tests/windows/driver_security_contract.ps1
          if (-not (Test-Path ThreatDetectionSuite/TDSDriver/TDSDriver.vcxproj)) { throw 'WDK project missing' }
