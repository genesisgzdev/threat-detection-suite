name: TDS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tds-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Contract and repository checks
        run: bash build.sh
      - name: Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate SOC bot dependencies
        run: python -m pip install --requirement tools/soc/requirements.txt
      - name: Check patch formatting
        run: git diff --check

  windows-user-mode:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Configure user-mode build
        run: cmake -S . -B build -A x64 -DTDS_ENABLE_YARA=OFF
      - name: Build user-mode components
        run: cmake --build build --config Release --parallel
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

  windows-driver-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate checked-in WDK project and shared ABI
        shell: pwsh
        run: |
          python tests/contract_checks.py
          pwsh -NoProfile -File tests/windows/driver_security_contract.ps1
          if (-not (Test-Path ThreatDetectionSuite/TDSDriver/TDSDriver.vcxproj)) { throw 'WDK project missing' }
