name: TDS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract and repository checks
        run: bash build.sh
      - name: Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check patch formatting
        run: git diff --check

  windows-user-mode:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure user-mode build
        run: cmake -S . -B build -A x64 -DTDS_ENABLE_YARA=OFF
      - name: Build user-mode components
        run: cmake --build build --config Release --parallel
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

  windows-driver-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate checked-in WDK project and shared ABI
        shell: pwsh
        run: |
          python tests/contract_checks.py
          pwsh -NoProfile -File tests/windows/driver_security_contract.ps1
          if (-not (Test-Path ThreatDetectionSuite/TDSDriver/TDSDriver.vcxproj)) { throw 'WDK project missing' }
