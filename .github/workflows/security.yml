name: Security Audit
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  audit:
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        with:
          languages: c-cpp
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure user-mode build for CodeQL
        run: cmake -S . -B build -A x64 -DTDS_ENABLE_YARA=OFF
      - name: Build user-mode code for CodeQL
        run: cmake --build build --config Release --parallel
      - uses: github/codeql-action/analyze@v3
      - name: Secret scan
        shell: pwsh
        run: |
          $version = '8.24.3'
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks-$version.zip"
          $install = Join-Path $env:RUNNER_TEMP "gitleaks-$version"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $install -Force
          & (Join-Path $install 'gitleaks.exe') detect --source . --redact --exit-code 1 --no-banner
