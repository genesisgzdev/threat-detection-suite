name: Security Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tds-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: c-cpp
          build-mode: manual
      - name: Configure user-mode build for CodeQL
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DTDS_ENABLE_YARA=OFF
      - name: Build user-mode code for CodeQL
        run: cmake --build build --config Release --parallel
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - name: Secret scan
        shell: pwsh
        run: |
          $version = '8.24.3'
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks-$version.zip"
          $install = Join-Path $env:RUNNER_TEMP "gitleaks-$version"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $install -Force
          & (Join-Path $install 'gitleaks.exe') detect --source . --redact --exit-code 1 --no-banner
